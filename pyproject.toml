[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "orket-extension-template"
version = "0.1.0"
description = "Headless Orket extension starter with a host runtime adapter."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "orket-extension-sdk>=0.7.1,<1.0.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.5,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
gateway = ["fastapi>=0.109,<1.0", "uvicorn>=0.27,<1.0"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1,<2"]

[project.scripts]
orket-extension = "extension_template.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: isolated domain behavior",
    "contract: public boundary and manifest checks",
    "integration: composed components or real HTTP with a simulated host",
]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
